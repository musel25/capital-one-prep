[project]
name = "capital-one-prep"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
